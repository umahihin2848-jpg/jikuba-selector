name: Ability field structure check

on:
  push:
    paths:
      - 'waku-bc-converter/ability-field-structure-v1.js'
      - 'waku-bc-converter/opponent-ranking-display-v1.js'
      - 'waku-bc-converter/validation/ability_gap_field_strength_shadow_v1.json'
      - 'waku-bc-converter/v3.html'
      - 'waku-bc-converter/v3-addons-loader-p.js'
      - 'tests/ability-field-structure-check.cjs'
      - '.github/workflows/ability-field-structure-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Ability field structure Shadow layer
        run: node tests/ability-field-structure-check.cjs

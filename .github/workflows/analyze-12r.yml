name: Analyze 12R market structure

on:
  push:
    paths:
      - 'analysis/analyze_12r.py'
      - 'analysis/analyze_12r_deep.py'
      - '.github/workflows/analyze-12r.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 12R base analysis
        run: python analysis/analyze_12r.py
      - name: Run 12R deep analysis
        run: python analysis/analyze_12r_deep.py

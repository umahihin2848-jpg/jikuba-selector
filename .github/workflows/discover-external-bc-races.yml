name: Discover external BC races
on:
  push:
    branches: ["historical-waku-backtest"]
permissions:
  contents: read
jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        year: ["2022","2026"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save cheerio@1.0.0
      - name: Discover
        env:
          YEAR: ${{ matrix.year }}
        run: node analysis/waku-backtest/discover_external_ids.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-${{ matrix.year }}
          path: analysis/waku-backtest/discover-out/

name: Discover external BC races
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year"
        required: true
        default: "2022"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save cheerio@1.0.0
      - name: Discover
        env:
          YEAR: ${{ inputs.year }}
        run: node analysis/waku-backtest/discover_external_ids.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-${{ inputs.year }}
          path: analysis/waku-backtest/discover-out/

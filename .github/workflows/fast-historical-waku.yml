name: Fast historical waku validation
on:
  push:
    branches: ["historical-waku-backtest"]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save cheerio@1.0.0
      - run: node analysis/waku-backtest/run_fast.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: fast-historical-waku-validation
          path: analysis/waku-backtest/fast-out/

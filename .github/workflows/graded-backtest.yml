name: Graded race market backtest

on:
  push:
    branches:
      - analysis-backtest-2021-2025

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "pandas>=2.2" requests beautifulsoup4 lxml
      - name: Run backtest
        run: python analysis/backtest_graded_2021_2025.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graded-backtest-2021-2025
          path: analysis/output/
          if-no-files-found: warn

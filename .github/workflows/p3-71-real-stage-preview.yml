name: P3-71 research-stage preview Chromium
on:
  push:
    branches: [research/p3-70-corner-stage-groups-20261123]
    paths:
      - 'waku-bc-converter/corner-stage-*.js'
      - 'waku-bc-converter/corner-stage-*.css'
      - 'waku-bc-converter/v3.html'
      - 'tests/p3-71-three-stage-real-browser.test.cjs'
      - '.github/workflows/p3-71-real-stage-preview.yml'
  workflow_dispatch:
jobs:
  mobile-preview-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser E2E
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Strict roster and 3-stage preview using synthetic horse data
        run: node tests/p3-71-three-stage-real-browser.test.cjs
      - name: Store synthetic-only screenshot and QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-71-synthetic-stage-browser-qa
          path: |
            p3-71-synthetic-three-stage-preview.png
            p3-71-synthetic-stage-summary.json
          if-no-files-found: ignore

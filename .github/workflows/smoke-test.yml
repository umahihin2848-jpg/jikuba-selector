name: App smoke test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/jikuba-server.log 2>&1 &
          sleep 2
      - name: Run core smoke tests
        run: |
          node tests/smoke.cjs
          node tests/numeric-normalization-smoke.cjs
          node tests/quinella-range-smoke.cjs
          node tests/race-scenario-v3-r32-smoke.cjs
          node tests/race-ux-semantics-v2-smoke.cjs
          node tests/race-role-parallel-smoke.cjs
          node tests/market-independent-center-smoke.cjs

  ledger-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/jikuba-server.log 2>&1 &
          sleep 2
      - name: Run prospective ledger smoke tests
        run: |
          node tests/prospective-ledger-smoke.cjs
          node tests/prospective-ticket-types-smoke.cjs

  v4-scanner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/jikuba-server.log 2>&1 &
          sleep 2
      - name: Run V4 and scanner smoke tests
        run: |
          node tests/race-scenario-v4-smoke.cjs
          node tests/waku-bc-scanner-smoke.cjs

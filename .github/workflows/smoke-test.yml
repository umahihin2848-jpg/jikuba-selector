name: App smoke test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/jikuba-server.log 2>&1 &
          sleep 2
      - name: Run smoke test
        run: node tests/smoke.cjs

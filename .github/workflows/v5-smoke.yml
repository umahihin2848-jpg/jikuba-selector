name: V5 iPhone smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "waku-bc-converter/v5.html"
      - "waku-bc-converter/v5.css"
      - "waku-bc-converter/v5-ui.js"
      - "waku-bc-converter/v5-goal-map-v1.js"
      - "waku-bc-converter/v5-ux-polish-v1.js"
      - "waku-bc-converter/v5-layout-fix-v1.js"
      - "waku-bc-converter/v5-decision-scenario-v1.js"
      - "waku-bc-converter/v5-op-market-v1.js"
      - "waku-bc-converter/v5-threewin-market-v1.js"
      - "waku-bc-converter/data/threewin_market_structure_v1.json"
      - "waku-bc-converter/v5-popularity-range-v1.js"
      - "waku-bc-converter/v5-quick-view-v2.js"
      - "waku-bc-converter/v5-horse-kart-v3.js"
      - "waku-bc-converter/v5-structural-focus-compat-v1.js"
      - "waku-bc-converter/v5-display-polish-v1.js"
      - "waku-bc-converter/v5-confidence-course-v1.js"
      - "waku-bc-converter/v5-analysis-stability-v1.js"
      - "waku-bc-converter/course-fit-export-v1.js"
      - "waku-bc-converter/v4-app.js"
      - "waku-bc-converter/v4-m3-engine-v1.js"
      - "waku-bc-converter/v4-validated-flow-v1.js"
      - "waku-bc-converter/v4-candidate-classifier-v1.js"
      - "waku-bc-converter/v4-webkit-stability-v1.js"
      - "waku-bc-converter/v3q.html"
      - "waku-bc-converter/v3-runtime-cache-q16.js"
      - "waku-bc-converter/v3-addons-loader-p.js"
      - "waku-bc-converter/remaining600-validated-v1.js"
      - "waku-bc-converter/finish600-simulator-v2.js"
      - "tests/race-scenario-v5-a16-smoke.cjs"
      - ".github/workflows/v5-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check V5 scripts
        run: |
          for f in \
            waku-bc-converter/v5-ui.js \
            waku-bc-converter/v5-goal-map-v1.js \
            waku-bc-converter/v5-ux-polish-v1.js \
            waku-bc-converter/v5-layout-fix-v1.js \
            waku-bc-converter/v5-decision-scenario-v1.js \
            waku-bc-converter/v5-op-market-v1.js \
            waku-bc-converter/v5-threewin-market-v1.js \
            waku-bc-converter/v5-popularity-range-v1.js \
            waku-bc-converter/v5-quick-view-v2.js \
            waku-bc-converter/v5-horse-kart-v3.js \
            waku-bc-converter/v5-structural-focus-compat-v1.js \
            waku-bc-converter/v5-display-polish-v1.js \
            waku-bc-converter/v5-confidence-course-v1.js \
            waku-bc-converter/course-fit-export-v1.js \
            waku-bc-converter/v5-analysis-stability-v1.js \
            waku-bc-converter/v4-app.js \
            waku-bc-converter/v4-m3-engine-v1.js \
            waku-bc-converter/v4-validated-flow-v1.js \
            waku-bc-converter/v4-candidate-classifier-v1.js \
            waku-bc-converter/v4-webkit-stability-v1.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/jikuba-v5-server.log 2>&1 &
          sleep 2
      - name: Run V5 iPhone race flow test
        run: node tests/race-scenario-v5-a16-smoke.cjs

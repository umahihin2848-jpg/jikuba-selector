<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><title>レーススキャナー</title>
<style>:root{--bg:#06111d;--card:#0b1a2a;--line:#29415e;--txt:#eef5fb;--sub:#9fb0c3;--g:#58d3a5;--y:#f3cd62}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111d,#081624 45%,#06111d);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:14px 10px 70px}h1{font-size:24px;margin:0 0 5px}.muted{color:var(--sub);font-size:11px;line-height:1.55}.card{background:rgba(11,26,42,.97);border:1px solid var(--line);border-radius:17px;padding:14px;margin:11px 0}.notice{background:#0a1726;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;line-height:1.6}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.actions,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}button,.filebtn{border:0;border-radius:11px;padding:10px 12px;font-weight:900;background:#237f63;color:#fff;font-size:13px}.secondary{background:#20364e!important;color:#dce9f5}.tabs button{flex:1}.tabs button.active{background:#237f63!important}.race{border:1px solid #29415e;border-radius:13px;padding:11px;margin-top:8px;background:#081624}.score{font-size:20px;font-weight:950}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950}.green{background:#0b2a22;color:#76efc3;border:1px solid #2f8f6a}.yellow{background:#2a2514;color:#ffe184;border:1px solid #806b25}.gray{background:#152333;color:#b8c9d9;border:1px solid #31506f}.bar{height:7px;border-radius:999px;background:#15283c;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#58d3a5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini div{background:#0b1d2e;border-radius:8px;padding:7px;font-size:10px}.mini b{display:block;font-size:14px;margin-top:2px}.empty{text-align:center;padding:24px;color:#9fb0c3}.detail{width:100%;margin-top:8px}.status{margin-top:8px;color:#9fb0c3;font-size:11px}.filebtn{display:inline-block;cursor:pointer}.filebtn input{display:none}@media(max-width:620px){.mini{grid-template-columns:1fr 1fr}.actions>*{flex:1}}</style></head>
<body><main class="wrap"><h1>今日のレーススキャナー</h1><div class="muted">当日の全レースを読み込み、単勝・枠連の市場構造から精査候補だけを抽出します。スコアは購入判定ではありません。</div>
<section class="card"><div class="notice"><b>自動取得ブリッジ対応。</b> WindowsのJV-Link取得側が <code>data/today.json</code> を更新すると、iPhone側は「今日のデータを更新」だけで全レースを読み込みます。ブリッジ未接続でもJSONファイルを手動取込して動作確認できます。</div><div class="actions"><button id="refresh">今日のデータを更新</button><label class="filebtn secondary">JSONを取込<input id="file" type="file" accept="application/json,.json"></label><button id="clear" class="secondary">表示を消去</button></div><div id="status" class="status">未読込</div></section>
<section class="card"><div class="top"><div><b>スキャン結果</b><div class="muted">歪みスコア順。🟢だけ詳細分析へ送れます。</div></div><b id="count">0R</b></div><div class="tabs"><button data-f="all" class="active secondary">全部</button><button data-f="green" class="secondary">🟢 精査</button><button data-f="yellow" class="secondary">🟡 候補</button></div><div id="list"></div></section></main>
<script>(function(){'use strict';var KEY='wakuRaceScannerV2',HANDOFF='wakuScannerHandoffV1',filter='all';function $(x){return document.getElementById(x)}function inv(x){return x>0?1/x:0}function norm(obj){var z=Object.values(obj).reduce(function(a,x){return a+inv(Number(x))},0),r={};Object.keys(obj).forEach(function(k){r[k]=z?inv(Number(obj[k]))/z:0});return r}function calc(r){var win={};(r.horses||[]).forEach(function(h){if(+h.winOdds>0)win[String(h.horseNo)]=+h.winOdds});var fr=r.frameOdds||{},w=norm(win),f=norm(fr),horse=Object.keys(w).sort(function(a,b){return w[b]-w[a]}),top=horse.slice(0,4),frames=Object.keys(f).sort(function(a,b){return f[b]-f[a]}),concentration=top.reduce(function(a,k){return a+w[k]},0),frameTop=frames.slice(0,6).reduce(function(a,k){return a+f[k]},0),entropy=0;Object.values(w).forEach(function(p){if(p>0)entropy-=p*Math.log(p)});var maxEnt=Math.log(Math.max(2,Object.keys(w).length)),clarity=maxEnt?1-entropy/maxEnt:0,score=Math.max(0,Math.min(100,Math.round(100*(.45*concentration+.35*frameTop+.20*clarity))));return Object.assign({},r,{score:score,concentration:concentration,frameTop:frameTop,clarity:clarity,top:top})}function cls(s){return s>=65?'green':s>=50?'yellow':'gray'}function label(s){return s>=65?'🟢 精査':s>=50?'🟡 候補':'⚪ 整合'}function pct(x){return(x*100).toFixed(1)+'%'}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function save(feed,rows){localStorage.setItem(KEY,JSON.stringify({feed:feed,rows:rows}))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"feed":{},"rows":[]}')}catch(e){return{feed:{},rows:[]}}}function ingest(feed){if(!feed||!Array.isArray(feed.races))throw new Error('races配列がありません');var valid=feed.races.filter(function(r){return Array.isArray(r.horses)&&r.horses.length>=4&&r.frameOdds&&Object.keys(r.frameOdds).length>=3}),rows=valid.map(calc).sort(function(a,b){return b.score-a.score});save(feed,rows);$('status').textContent='取得 '+rows.length+'R｜'+(feed.source||'source不明')+'｜'+(feed.generatedAt||'時刻不明')+(feed.snapshot?'｜'+feed.snapshot:'');render()}function render(){var s=load(),a=s.rows||[];if(filter!=='all')a=a.filter(function(x){return cls(x.score)===filter});$('count').textContent=a.length+'R';$('list').innerHTML=a.length?a.map(function(r){var title=(r.venue||'')+(r.raceNo||'')+'R '+(r.raceName||'');return'<div class="race"><div class="top"><div><b>'+esc(title)+'</b><div class="muted">'+esc(r.date||'')+' '+esc(r.startTime||'')+'｜'+(r.runners||((r.horses||[]).length))+'頭｜上位単勝 '+r.top.join('・')+'番</div></div><div style="text-align:right"><span class="pill '+cls(r.score)+'">'+label(r.score)+'</span><div class="score">'+r.score+'</div></div></div><div class="bar"><i style="width:'+r.score+'%"></i></div><div class="mini"><div>単勝上位4集中<b>'+pct(r.concentration)+'</b></div><div>枠連上位6集中<b>'+pct(r.frameTop)+'</b></div><div>単勝明瞭度<b>'+pct(r.clarity)+'</b></div></div>'+(cls(r.score)==='green'?'<button class="detail" data-id="'+esc(r.date)+'|'+esc(r.venue)+'|'+esc(r.raceNo)+'">このレースを詳細分析へ</button>':'')+'</div>'}).join(''):'<div class="empty">対象レースがありません。</div>';document.querySelectorAll('.detail').forEach(function(b){b.onclick=function(){var p=b.dataset.id.split('|'),r=(load().rows||[]).find(function(x){return String(x.date)===p[0]&&String(x.venue)===p[1]&&String(x.raceNo)===p[2]});if(!r)return;localStorage.setItem(HANDOFF,JSON.stringify(r));location.href='app-v4.html?fromScanner=1'}})}$('refresh').onclick=function(){var u='data/today.json?t='+Date.now();fetch(u,{cache:'no-store'}).then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json()}).then(function(feed){if(!feed.races||!feed.races.length)throw new Error('JV-Linkブリッジがまだ今日のデータを出力していません');ingest(feed)}).catch(function(e){$('status').textContent='更新できません：'+e.message})};$('file').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(function(t){ingest(JSON.parse(t))}).catch(function(err){$('status').textContent='JSON取込エラー：'+err.message})};$('clear').onclick=function(){localStorage.removeItem(KEY);$('status').textContent='表示を消去しました';render()};document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});var initial=load();if(initial.feed&&initial.feed.generatedAt)$('status').textContent='保存済み '+(initial.rows||[]).length+'R｜'+(initial.feed.generatedAt||'');render()})();</script></body></html>

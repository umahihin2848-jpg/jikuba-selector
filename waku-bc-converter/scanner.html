<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><title>レーススキャナー</title>
<style>:root{--bg:#06111d;--card:#0b1a2a;--line:#29415e;--txt:#eef5fb;--sub:#9fb0c3;--g:#58d3a5;--y:#f3cd62;--r:#ff7777}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111d,#081624 45%,#06111d);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:14px 10px 70px}h1{font-size:24px;margin:0 0 5px}.muted{color:var(--sub);font-size:11px;line-height:1.55}.card{background:rgba(11,26,42,.97);border:1px solid var(--line);border-radius:17px;padding:14px;margin:11px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:11px;font-weight:800;color:#aebed0;margin-bottom:5px}input,textarea{width:100%;border:1px solid #31506f;border-radius:10px;background:#071522;color:#fff;padding:10px;font-size:16px}textarea{min-height:120px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:900;background:#237f63;color:#fff}.wide{width:100%;margin-top:10px}.notice{background:#0a1726;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;line-height:1.6}.race{border:1px solid #29415e;border-radius:13px;padding:11px;margin-top:8px;background:#081624}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.score{font-size:20px;font-weight:950}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950}.green{background:#0b2a22;color:#76efc3;border:1px solid #2f8f6a}.yellow{background:#2a2514;color:#ffe184;border:1px solid #806b25}.gray{background:#152333;color:#b8c9d9;border:1px solid #31506f}.bar{height:7px;border-radius:999px;background:#15283c;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#58d3a5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini div{background:#0b1d2e;border-radius:8px;padding:7px;font-size:10px}.mini b{display:block;font-size:14px;margin-top:2px}.empty{text-align:center;padding:24px;color:#9fb0c3}.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;background:#20364e}.tabs button.active{background:#237f63}@media(max-width:620px){.grid{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="wrap"><h1>今日のレーススキャナー</h1><div class="muted">単勝と枠連の市場構造から「詳しく見る価値があるレース」を先に絞ります。これは購入判定ではなく、精査候補の抽出です。</div>
<section class="card"><div class="notice"><b>現在は入力型スキャナー。</b> JRA-VAN Data Lab / JV-Link はWindows上のクライアントAPIなので、iPhoneの静的Webアプリから直接取得はできません。自動取得用ブリッジを接続できるよう、データ取込口を分離しています。</div><div class="grid" style="margin-top:10px"><div><label>日付</label><input id="date" type="date"></div><div><label>レース名（任意）</label><input id="name" placeholder="例 東京11R ○○S"></div></div><label style="margin-top:10px">単勝オッズ（馬番=オッズ）</label><textarea id="win" placeholder="1=3.2 2=8.4 3=5.1 4=18.6 ..."></textarea><label style="margin-top:10px">枠連オッズ（枠-枠=オッズ）</label><textarea id="frame" placeholder="1-2=5.8 1-3=9.4 1-4=18.2 ..."></textarea><button id="add" class="wide">このレースをスキャン</button></section>
<section class="card"><div class="top"><div><b>スキャン結果</b><div class="muted">歪みスコア順</div></div><button id="clear" style="background:#20364e">全消去</button></div><div class="tabs"><button data-f="all" class="active">全部</button><button data-f="green">🟢 精査</button><button data-f="yellow">🟡 候補</button></div><div id="list"></div></section></main>
<script>(function(){'use strict';var KEY='wakuRaceScannerV1',filter='all';function $(x){return document.getElementById(x)}function parse(s){var o={};String(s||'').split(/[\s,、\n]+/).forEach(function(t){var m=t.match(/^(\d+(?:-\d+)?)\s*[=:]\s*(\d+(?:\.\d+)?)$/);if(m)o[m[1]]=+m[2]});return o}function inv(x){return x>0?1/x:0}function norm(obj){var z=Object.values(obj).reduce(function(a,x){return a+inv(x)},0),r={};Object.keys(obj).forEach(function(k){r[k]=z?inv(obj[k])/z:0});return r}function calc(win,fr){var w=norm(win),f=norm(fr),horse=Object.keys(w).sort(function(a,b){return w[b]-w[a]}),top=horse.slice(0,4),frames=Object.keys(f).sort(function(a,b){return f[b]-f[a]}),concentration=top.reduce(function(a,k){return a+w[k]},0),frameTop=frames.slice(0,6).reduce(function(a,k){return a+f[k]},0);/* scanner deliberately measures structure, not a claimed fair-price probability */var entropy=0;Object.values(w).forEach(function(p){if(p>0)entropy-=p*Math.log(p)});var maxEnt=Math.log(Math.max(2,Object.keys(w).length)),clarity=maxEnt?1-entropy/maxEnt:0;var score=Math.max(0,Math.min(100,Math.round(100*(.45*concentration+.35*frameTop+.20*clarity))));return{score:score,concentration:concentration,frameTop:frameTop,clarity:clarity,top:top}}function rows(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function cls(s){return s>=65?'green':s>=50?'yellow':'gray'}function label(s){return s>=65?'🟢 精査':s>=50?'🟡 候補':'⚪ 整合'}function render(){var a=rows().sort(function(x,y){return y.score-x.score});if(filter!=='all')a=a.filter(function(x){return cls(x.score)===filter});$('list').innerHTML=a.length?a.map(function(r){return'<div class="race"><div class="top"><div><b>'+esc(r.name||'名称未入力')+'</b><div class="muted">'+esc(r.date||'')+'｜上位単勝 '+r.top.join('・')+'番</div></div><div style="text-align:right"><span class="pill '+cls(r.score)+'">'+label(r.score)+'</span><div class="score">'+r.score+'</div></div></div><div class="bar"><i style="width:'+r.score+'%"></i></div><div class="mini"><div>単勝上位4集中<b>'+pct(r.concentration)+'</b></div><div>枠連上位6集中<b>'+pct(r.frameTop)+'</b></div><div>単勝明瞭度<b>'+pct(r.clarity)+'</b></div></div></div>'}).join(''):'<div class="empty">まだスキャン結果はありません。</div>'}function pct(x){return(x*100).toFixed(1)+'%'}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}$('date').value=new Date().toISOString().slice(0,10);$('add').onclick=function(){var w=parse($('win').value),f=parse($('frame').value);if(Object.keys(w).length<4||Object.keys(f).length<3){alert('単勝4頭以上・枠連3組以上を入力してください');return}var c=calc(w,f),a=rows();a.push(Object.assign({id:Date.now(),date:$('date').value,name:$('name').value||'レース'},c));save(a);$('name').value='';$('win').value='';$('frame').value='';render()};$('clear').onclick=function(){if(confirm('スキャン履歴を全て消しますか？')){save([]);render()}};document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});render()})();</script></body></html>

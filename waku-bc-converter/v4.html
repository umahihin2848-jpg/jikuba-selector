<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>Race Scenario v4</title>
<link rel="stylesheet" href="v4.css?v=20261009v4a">
</head>
<body>
<div class="appShell">
  <header class="appHeader">
    <div>
      <div class="eyebrow">RACE SCENARIO</div>
      <h1>競馬分析 v4</h1>
      <p>基礎確率 × M3末脚 × RPCI × 隊列 × 波乱構造</p>
    </div>
    <div class="buildBadge">V4 A</div>
  </header>

  <main>
    <section class="statusStrip" aria-live="polite">
      <span id="persistStatus">保存準備中</span>
      <span id="modelStatus">モデル待機</span>
    </section>

    <section class="card">
      <div class="sectionHead">
        <div><span class="step">01</span><h2>レース条件</h2></div>
        <span class="sub">発走前の客観情報</span>
      </div>
      <div class="formGrid">
        <label>日付<input id="raceDate" type="date"></label>
        <label>競馬場<select id="venue"><option value="">選択</option><option>東京</option><option>中山</option><option>京都</option><option>阪神</option><option>中京</option><option>札幌</option><option>函館</option><option>福島</option><option>新潟</option><option>小倉</option></select></label>
        <label>レース名<input id="raceName" placeholder="○○ステークス"></label>
        <label>頭数<input id="fieldSize" type="number" min="2" max="30" inputmode="numeric" placeholder="16"></label>
        <label>芝 / ダート<select id="surface"><option>芝</option><option>ダート</option></select></label>
        <label>距離<input id="distance" type="number" min="600" max="5000" inputmode="numeric" placeholder="1600"></label>
        <label>格<select id="grade"><option>G1</option><option>G2</option><option>G3</option><option>L</option><option>OP</option><option>3勝</option></select></label>
        <label>馬場状態<select id="going"><option>良</option><option>稍</option><option>重</option><option>不</option></select></label>
      </div>
    </section>

    <section class="card">
      <div class="sectionHead">
        <div><span class="step">02</span><h2>過去走CSV</h2></div>
        <span id="csvState" class="pill muted">未選択</span>
      </div>
      <label class="fileDrop">
        <input id="csvFile" type="file" accept=".csv,text/csv">
        <span class="fileIcon">CSV</span>
        <span><b id="csvName">TARGET CSVを選択</b><small>選択したデータは端末内に保存され、Safariを閉じても復元します。</small></span>
      </label>
      <button id="clearCsvBtn" class="textBtn" type="button">CSV保存データを解除</button>
    </section>

    <section class="card">
      <div class="sectionHead">
        <div><span class="step">03</span><h2>単勝オッズ</h2></div>
        <span id="oddsCount" class="pill muted">0頭</span>
      </div>
      <textarea id="oddsPaste" rows="7" placeholder="1 3.2&#10;2 5.8&#10;3 12.4"></textarea>
      <div class="hint">「馬番 オッズ」を1行ずつ。貼り付けるだけで自動保存します。</div>
    </section>

    <button id="analyzeBtn" class="analyzeBtn" type="button"><span>解析する</span><small>検証済みエンジンを一時起動</small></button>
    <div id="errorBox" class="errorBox hidden" role="alert"></div>

    <section id="resultShell" class="resultShell hidden">
      <div class="resultTop">
        <div><span class="eyebrow">ANALYSIS</span><h2 id="resultTitle">解析結果</h2></div>
        <span id="resultFresh" class="pill good">最新</span>
      </div>
      <nav id="resultTabs" class="tabs" aria-label="解析結果">
        <button type="button" data-tab="summary" class="active">結論</button>
        <button type="button" data-tab="horses">全頭</button>
        <button type="button" data-tab="scenario">展開</button>
        <button type="button" data-tab="position">位置</button>
      </nav>
      <div id="resultPanel" class="resultPanel"></div>
    </section>

    <section class="card compactCard">
      <div class="sectionHead">
        <div><span class="step">04</span><h2>端末保存</h2></div>
        <span class="pill good">自動</span>
      </div>
      <p class="saveText">レース条件・オッズ・CSV本体・直近の解析結果をIndexedDBへ保存します。Safari再起動後もこの画面から続けられます。</p>
      <button id="clearAllBtn" class="dangerBtn" type="button">このレースの保存データを全削除</button>
    </section>
  </main>
</div>
<div id="engineHost" aria-hidden="true"></div>
<script>window.RSA_V4_BUILD='20261009v4a';</script>
<script src="v4-app.js?v=20261009v4a"></script>
<script src="v4-webkit-stability-v1.js?v=20261009v4a2"></script>
</body>
</html>

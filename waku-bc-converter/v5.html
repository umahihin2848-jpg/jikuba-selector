<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080e">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
(()=>{const B='20261009v5a5',u=new URL(location.href);if(u.searchParams.get('build')!==B){u.searchParams.set('build',B);u.searchParams.set('_cb',Date.now().toString());location.replace(u.toString())}})();

<title>Race Flow V5</title>
<link rel="stylesheet" href="v5.css?v=20261009v5a5">
</head>
<body>
<div class="v5App">
  <header class="v5Header">
    <div>
      <div class="v5Eyebrow">RACE FLOW</div>
      <h1>競馬分析</h1>
      <p>市場 → ペース → 隊列 → 残600m → シナリオ</p>
    </div>
    <div class="v5Build">V5 A5</div>
  </header>

  <div class="v5Status" aria-live="polite">
    <span id="persistStatus">保存準備中</span>
    <span id="modelStatus">モデル待機</span>
  </div>

  <main>
    <section class="v5Setup">
      <div class="v5SetupTitle">
        <div><span>01</span><b>レースをセット</b></div>
        <small>CSV + オッズ → 解析</small>
      </div>

      <details class="v5RaceDetails" open>
        <summary>レース条件</summary>
        <div class="v5RaceGrid">
          <label>日付<input id="raceDate" type="date"></label>
          <label>競馬場<select id="venue"><option value="">選択</option><option>東京</option><option>中山</option><option>京都</option><option>阪神</option><option>中京</option><option>札幌</option><option>函館</option><option>福島</option><option>新潟</option><option>小倉</option></select></label>
          <label class="wide">レース名<input id="raceName" placeholder="○○ステークス"></label>
          <label>頭数<input id="fieldSize" type="number" min="2" max="30" inputmode="numeric" placeholder="16"></label>
          <label>芝 / ダート<select id="surface"><option>芝</option><option>ダート</option></select></label>
          <label>距離<input id="distance" type="number" min="600" max="5000" inputmode="numeric" placeholder="1800"></label>
          <label>格<select id="grade"><option>G1</option><option>G2</option><option>G3</option><option>L</option><option>OP</option><option>3勝</option></select></label>
          <label>馬場<select id="going"><option>良</option><option>稍</option><option>重</option><option>不</option></select></label>
        </div>
      </details>

      <div class="v5InputPair">
        <label class="v5Upload">
          <input id="csvFile" type="file" accept=".csv,text/csv">
          <span class="v5InputIcon">CSV</span>
          <span class="v5InputText"><small>PAST RUN DATA</small><b id="csvName">TARGET CSVを選択</b><em id="csvState">未選択</em></span>
        </label>
        <button id="clearCsvBtn" class="v5MiniBtn" type="button">CSV解除</button>
      </div>

      <div class="v5OddsBlock">
        <div class="v5FieldHead"><span><small>WIN ODDS</small><b>単勝オッズ</b></span><strong id="oddsCount">0頭</strong></div>
        <textarea id="oddsPaste" rows="5" placeholder="1 3.2&#10;2 5.8&#10;3 12.4"></textarea>
      </div>

      <button id="analyzeBtn" class="v5Analyze" type="button">
        <span>RACE ANALYSIS</span><small>検証済みモデルで解析する</small>
      </button>
      <div id="errorBox" class="v5Error hidden" role="alert"></div>
    </section>

    <section id="v5ResultShell" class="v5Results hidden">
      <div class="v5RaceHero">
        <div>
          <div class="v5Eyebrow">ANALYZED RACE</div>
          <h2 id="v5Title">解析結果</h2>
          <p id="v5Meta"></p>
        </div>
        <span class="v5LiveDot">LIVE MODEL</span>
      </div>

      <div id="v5Panel" class="v5Panel"></div>
    </section>

    <section class="v5Storage">
      <div><small>DEVICE STORAGE</small><b>入力・CSV・直近解析を端末保存</b></div>
      <button id="clearAllBtn" type="button">保存データ削除</button>
    </section>
  </main>
</div>

<nav id="v5Tabs" class="v5BottomNav hidden" aria-label="解析タブ">
  <button class="active" type="button" data-v5-tab="overview"><span class="navIcon">◉</span><b>診断</b></button>
  <button type="button" data-v5-tab="formation"><span class="navIcon">≋</span><b>隊列</b></button>
  <button type="button" data-v5-tab="scenario"><span class="navIcon">⌁</span><b>展開</b></button>
  <button type="button" data-v5-tab="horses"><span class="navIcon">◇</span><b>全頭</b></button>
</nav>

<section id="resultShell" class="hidden legacyV4" aria-hidden="true">
  <h2 id="resultTitle">解析結果</h2><span id="resultFresh"></span>
  <nav id="resultTabs"><button data-tab="summary" class="active">結論</button><button data-tab="horses">全頭</button><button data-tab="scenario">展開</button><button data-tab="position">位置</button></nav>
  <div id="resultPanel"></div>
</section>
<div id="engineHost" aria-hidden="true"></div>

<script src="v5-layout-fix-v1.js?v=20261009v5a5"></script>
<script src="v4-webkit-stability-v1.js?v=20261009v4d3"></script>
</body>
</html>

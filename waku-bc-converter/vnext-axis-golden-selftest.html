<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vNext Axis Golden Self-Test</title><style>body{font-family:ui-monospace,monospace;background:#07131f;color:#dbeaf0;padding:16px}pre{white-space:pre-wrap}.pass{color:#8ee0b5}.fail{color:#ff9fa7}</style><body><h1>vNext Axis Golden Self-Test</h1><div id="status">RUNNING</div><pre id="out"></pre><script src="vnext-axis-core-v1.js"></script><script>
(async()=>{const C=window.VNextAxisCoreV1,st=document.getElementById('status'),out=document.getElementById('out');try{const M=await fetch('data/vnext_axis_reference_models_20261028.json',{cache:'no-store'}).then(r=>r.json());const parts=await Promise.all([1,2,3,4].map(i=>fetch(`../docs/golden/vnext_fixture_chunk_0${i}.txt`,{cache:'no-store'}).then(r=>r.text())));const b=parts.join('').trim(),raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),ab=await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer(),G=JSON.parse(new TextDecoder().decode(ab));let mainRoute=0,mainAxis=0,mainTier=0,maxMain=0,full=0,fallback=0,simple=0,maxFull=0,maxFallback=0,maxSimple=0;const errors=[];for(const race of G.races){const rows=race.r.map(a=>({horse_no:a[0],grade:a[1],surface:a[2],distance:a[3],field:a[4],market_share:a[5],abp3_wf:a[6],abRank_wf:a[7],m3Rank_wf:a[8],m3score_wf:a[9],hist_n:a[10],pred_front:a[11]}));for(const key of ['full_reference','fallback_reference','simplified_shadow']){if(key==='full_reference'&&!race.q)continue;const ex=race.ex[key];if(!ex)continue;const res=C.scoreRace(rows,M[key]);const d=Math.abs((res.axis?.score??NaN)-ex[1]);if(key==='full_reference'){full++;maxFull=Math.max(maxFull,d)}else if(key==='fallback_reference'){fallback++;maxFallback=Math.max(maxFallback,d)}else{simple++;maxSimple=Math.max(maxSimple,d)}if(res.axis?.no!==String(ex[0])||res.axis?.tier!==ex[2]||!(d<1e-10))errors.push({race:race.k,model:key,got:res.axis,expected:ex,d});}const model=race.q?M.full_reference:M.fallback_reference,res=C.scoreRace(rows,model),ex=race.main,rt=race.q?'FULL_QUEUE':'FALLBACK_NO_QUEUE',d=Math.abs((res.axis?.score??NaN)-ex[1]);if(rt===race.route)mainRoute++;if(res.axis?.no===String(ex[0]))mainAxis++;if(res.axis?.tier===ex[2])mainTier++;maxMain=Math.max(maxMain,d);}const n=G.races.length,pass=maxFull<1e-10&&maxFallback<1e-10&&maxSimple<1e-10&&mainRoute===n&&mainAxis===n&&mainTier===n&&maxMain<1e-10&&!errors.length;const report={pass,userAgent:navigator.userAgent,coreVersion:C.VERSION,races:n,checks:{full,fallback,simple},maxFull,maxFallback,maxSimple,routeMatch:`${mainRoute}/${n}`,axisMatch:`${mainAxis}/${n}`,tierMatch:`${mainTier}/${n}`,maxAxisScoreError:maxMain,errors};window.__VNextGoldenSelfTest=report;document.documentElement.dataset.selftest=pass?'pass':'fail';st.textContent=pass?'PASS':'FAIL';st.className=pass?'pass':'fail';out.textContent=JSON.stringify(report,null,2)}catch(e){const report={pass:false,error:String(e)};window.__VNextGoldenSelfTest=report;document.documentElement.dataset.selftest='fail';st.textContent='FAIL';st.className='fail';out.textContent=JSON.stringify(report,null,2)}})();
</script></body></html>
